<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c3e50">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Medicīniskais skats — Aprūpes sistēma</title>
  <link rel="stylesheet" href="css/index.css?v=20261008-1600">
  <link rel="stylesheet" href="css/medicine.css?v=20261008-1600">
  <link rel="icon" href="logo/logo_admin.png" type="image/png">
</head>
<body>
  <div class="splash-screen" id="splashScreen">
    <div class="splash-bg">
      <div class="splash-gradient"></div>
    </div>
    <div class="splash-content">
      <img src="logo/logoDS.png" alt="Aprūpes sistēma" class="splash-logo">
      <h1 class="splash-title">Aprūpes sistēma</h1>
      <p class="splash-subtitle">Medicīniskais skats</p>
    </div>
  </div>

  <div class="top-bar">
    <div class="top-bar-left">
      <button id="btnBack" class="icon-btn" title="Atpakaļ">
        <span>←</span>
      </button>
      <h1 class="top-bar-title">🏥 Medicīniskais skats</h1>
    </div>
    <div class="top-bar-right">
      <div class="lang-switcher-global">
        <button data-lang="lv" class="lang-btn active">LV</button>
        <button data-lang="ru" class="lang-btn">RU</button>
        <button data-lang="en" class="lang-btn">EN</button>
      </div>
      <button id="manualSyncBtn" class="icon-btn" title="Sinhor." style="display:none;">
        <span>🔄</span>
      </button>
      <button id="logoutBtn" class="icon-btn" title="Iziet">
        <span>🚪</span>
      </button>
    </div>
  </div>

  <div class="status-message" id="statusMessage"></div>

  <!-- ═══════════════════════════════════════════════════════════════════
       MEDICĪNA kā FILTRS (spec §2, §11).

       Pirmajā ekrānā, bez ritināšanas:
         🏥 MEDICĪNA
         🔴 Uzmanība — X klienti
         📈 Tendence — X klienti
         🔎 Meklēt klientu
         👥 Visi klienti (aizvākti līdz apzinātai atvēršanai)

       Nevis "parādi visus datus", bet "parādi, kam šobrīd jāpievērš
       uzmanība un kāpēc".
       ═══════════════════════════════════════════════════════════════════ -->
  <main class="med-container">

    <section class="med-view" id="medListView">
      <div id="medHeadline" class="med-headline"></div>

      <div class="med-toolbar">
        <input type="search" id="clientSearch" class="med-search" placeholder="🔎 Meklēt klientu...">
        <input type="date" id="dateFilter" class="med-date">
      </div>

      <div id="medClientList" class="med-client-list"></div>
    </section>

    <section class="med-view" id="medDetailView" style="display:none;">
      <div id="medDetail" class="med-detail"></div>
    </section>

  </main>

  <script src="js/config.js?v=20261008-1600"></script>
  <script src="js/db.js?v=20261008-1600"></script>
  <script src="js/i18n.js?v=20261008-1600"></script>
  <script src="js/perf.js?v=20261008-1600"></script>
  <script src="js/operation_registry.js?v=20261008-1600"></script>
  <script src="js/sync.js?v=20261008-1600"></script>
  <script src="js/timezone.js?v=20261008-1600"></script>
  <script src="js/logout.js?v=20261008-1600"></script>
  <script src="js/medicine_view.js?v=20261008-1600"></script>
  <script src="js/update_notifier.js?v=20261008-1600"></script>
</body>
</html>
