<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c3e50">
  <title data-i18n="appName">Aprūpes sistēma</title>
  <link rel="stylesheet" href="css/index.css?v=20250912-1735">
  <link rel="icon" href="logo/logo_admin.png" type="image/png">
</head>
<body>
  <div class="splash-screen" id="splashScreen">
    <div class="splash-bg">
      <div class="splash-gradient"></div>
      <div class="splash-particles" id="splashParticles"></div>
    </div>
    <div class="splash-content">
      <img src="logo/logoDS.png" alt="Aprūpes sistēma" class="splash-logo">
      <h1 class="splash-title" data-i18n="appName">Aprūpes sistēma</h1>
      <p class="splash-subtitle" data-i18n="splashSubtitle">Sistēma pieaugušo aprūpes ierakwiem</p>
    </div>
  </div>

  <div class="lang-switcher-global">
    <button data-lang="lv" class="lang-btn active">LV</button>
    <button data-lang="ru" class="lang-btn">RU</button>
    <button data-lang="en" class="lang-btn">EN</button>
  </div>

  <div class="login-container" id="loginContainer">
    <div class="login-card" id="loginCard">
      <div class="login-header">
        <img src="logo/logoDS.png" alt="Aprūpes sistēma" class="login-logo">
      </div>
      <h1 class="login-title" data-i18n="loginTitle">Aprūpes sistēma</h1>
      <p class="login-subtitle" data-i18n="loginSubtitle">Izvēlieties darbinieku un ievadiet PIN kodu</p>

      <div id="setupSection" class="setup-section" style="display:none;">
        <div class="setup-card">
          <div class="setup-icon">👋</div>
          <h2 class="setup-title" data-i18n="setupTitle">Izveido pirmo administratoru</h2>
          <form id="setupForm" autocomplete="off">
            <div class="form-group">
              <label data-i18n="setupName">Vārds *</label>
              <input type="text" name="vards" required>
            </div>
            <div class="form-group">
              <label data-i18n="setupSurname">Uzvārds *</label>
              <input type="text" name="uzvards" required>
            </div>
            <div class="form-group">
              <label data-i18n="setupPin">PIN kods *</label>
              <input type="password" name="pin" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" required>
            </div>
            <button type="submit" class="btn-primary" data-i18n="setupBtn">Izveidot administratoru</button>
          </form>
          <div id="setupStatus" class="status-message"></div>
        </div>
      </div>

      <div id="loginSection">
        <div class="employee-search-row">
          <input type="text" id="employeeSearch" data-i18n="searchPlaceholder" placeholder="🔍 Meklēt darbinieku..." autocomplete="off">
        </div>

        <div class="role-filter" id="roleFilter">
          <button type="button" class="role-btn active" data-role="all" data-i18n="allEmployees">Visi</button>
          <button type="button" class="role-btn" data-role="administrators" data-i18n="admins">👑 Administrators</button>
          <button type="button" class="role-btn" data-role="kontroliere" data-i18n="controllers">📊 Kontroliere</button>
          <button type="button" class="role-btn" data-role="aprupetas" data-i18n="caregivers">🤝 Aprūpētāji</button>
        </div>

        <div class="employee-card-grid">
          <div class="employee-list" id="employeeList">
            <div class="loading" data-i18n="loading">Ielādēju...</div>
          </div>
        </div>

        <form id="loginForm" autocomplete="off">
          <div class="selected-employee" id="selectedEmployee" style="display:none;">
            <div class="selected-avatar" id="selectedAvatar">?</div>
            <div class="selected-info">
              <div class="selected-name" id="selectedName">—</div>
              <div class="selected-role" id="selectedRole">—</div>
            </div>
            <button type="button" class="clear-selection" title="Notīrīt izvēli">✕</button>
          </div>
          <div class="shift-type-selector" id="shiftTypeSelector" style="display:none;">
            <label data-i18n="shiftTypeLabel">Maiņas tips:</label>
            <div class="shift-type-options">
              <label class="shift-type-option">
                <input type="radio" name="shiftType" value="diennakts" checked>
                <span>🌙 Diennakts</span>
              </label>
              <label class="shift-type-option">
                <input type="radio" name="shiftType" value="dienas">
                <span>☀️ Dienas</span>
              </label>
            </div>
          </div>
          <input type="password" id="pinInput" inputmode="numeric" autocomplete="off" data-i18n="pinPlaceholder" placeholder="PIN __ __" maxlength="6" disabled>
          <button type="submit" id="loginBtn" disabled data-i18n="loginBtn">✓ Ienākt</button>
        </form>

        <div id="errorMessage" class="error-message" style="display:none;"></div>
        <div id="statusMessage" class="status-message"></div>
      </div>
    </div>
  </div>

  <div id="loadingOverlay" class="loading-overlay" style="display:none;">
    <div class="loading-modal">
      <img src="logo/logoDS.png" alt="Aprūpes sistēma" class="loading-logo">
      <div class="loading-spinner"></div>
      <div id="loadingText" class="loading-text" data-i18n="loading">Ielādēju datus...</div>
    </div>
  </div>
  <script src="js/config.js?v=20250912-1735"></script>
  <script src="js/i18n.js?v=20250912-1735"></script>
  <script src="js/db.js?v=20250912-1735"></script>
  <script src="js/sync.js?v=20250912-1735"></script>
  <script src="js/login.js?v=20250912-1735"></script>
  <script>
    (function() {
      var vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
      window.addEventListener('resize', function() {
        var vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', vh + 'px');
      });
    })();
    (function() {
      var particles = document.getElementById('splashParticles');
      if (!particles) return;
      var count = window.innerWidth <= 768 ? 30 : 60;
      for (var i = 0; i < count; i++) {
        var el = document.createElement('div');
        el.className = 'particle';
        el.style.left = Math.random() * 100 + '%';
        el.style.animationDuration = (2 + Math.random() * 3) + 's';
        el.style.animationDelay = Math.random() * 3 + 's';
        el.style.opacity = Math.random() * 0.6 + 0.2;
        particles.appendChild(el);
      }
    })();
  </script>
</body>
</html>
