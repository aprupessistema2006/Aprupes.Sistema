<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c3e50">
  <title>Aprūpes sistēma – Ienākšana</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" href="logo/logo_admin.png" type="image/png">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <img src="logo/logo_admin.png" alt="Aprūpes sistēma" class="login-logo">
      <h1>Aprūpes sistēma</h1>

      <div id="setupSection" style="display:none;">
        <p class="setup-title">👋 Izveido pirmo administratoru</p>
        <form id="setupForm" autocomplete="off">
          <div class="form-group">
            <label>Vārds *</label>
            <input type="text" name="vards" required>
          </div>
          <div class="form-group">
            <label>Uzvārds *</label>
            <input type="text" name="uzvards" required>
          </div>
          <div class="form-group">
            <label>PIN kods *</label>
            <input type="password" name="pin" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" required>
          </div>
          <button type="submit" class="btn-primary">Izveidot administratoru</button>
        </form>
        <div id="setupStatus" class="status-message"></div>
      </div>

      <div id="loginSection">
        <p id="loginSubtitle">Izvēlies darbinieku un ievadi PIN kodu</p>

        <div class="employee-search-row">
          <input type="text" id="employeeSearch" placeholder="🔍 Meklēt darbinieku..." autocomplete="off">
        </div>

        <div class="employee-list-wrap">
          <div class="employee-list" id="employeeList">
            <div class="loading">Ielādēju darbiniekus...</div>
          </div>
        </div>

        <form id="loginForm" autocomplete="off">
          <div class="selected-employee" id="selectedEmployee" style="display:none;">
            <div class="selected-avatar" id="selectedAvatar">?</div>
            <div class="selected-info">
              <div class="selected-name" id="selectedName">—</div>
              <div class="selected-role" id="selectedRole">—</div>
            </div>
            <button type="button" class="clear-selection" id="clearSelection" title="Notīrīt izvēli">✕</button>
          </div>
          <input type="password" id="pinInput" inputmode="numeric" autocomplete="off" placeholder="PIN __ __" maxlength="6" disabled>
          <button type="submit" id="loginBtn" disabled>✓ Ieiet</button>
        </form>

        <div id="errorMessage" class="error-message" style="display:none;"></div>
        <div id="statusMessage" class="status-message"></div>
      </div>
    </div>
  </div>
  <div id="loadingOverlay" class="loading-overlay" style="display:none;">
    <img src="logo/logo_admin.png" alt="Aprūpes sistēma" class="loading-logo">
    <div class="loading-spinner"></div>
    <div id="loadingText" class="loading-text">Ielādēju datus...</div>
  </div>
  <script src="js/config.js?v=20250907"></script>
  <script src="js/db.js?v=20250907"></script>
  <script src="js/sync.js?v=20250907"></script>
  <script src="js/login.js?v=20250907"></script>
</body>
</html>
