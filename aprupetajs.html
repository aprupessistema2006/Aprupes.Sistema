<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#2c3e50">
  <title data-i18n="loginTitle">Aprūpes forma</title>
  <link rel="stylesheet" href="css/aprupetajs.css?v=20260923-0840">
  <link rel="icon" href="logo/logo_admin.png" type="image/png">
</head>
<body>
<header class="header">
     <button id="backBtn" class="btn-icon btn-text-icon" title="Atpakaļ" data-i18n-title="backBtn"><span>←</span> <span data-i18n="backBtn">Atpakaļ</span></button>
     <div class="lang-switcher">
       <button data-lang="lv" class="lang-btn active">LV</button>
       <button data-lang="ru" class="lang-btn">RU</button>
       <button data-lang="en" class="lang-btn">EN</button>
     </div>
     <h1 id="clientName">...</h1>
     <span id="syncStatus" class="sync-badge" data-i18n="syncBtn">Saglabāts</span>
     <button id="manualSyncBtn" class="btn-icon btn-text-icon sync-btn" title="Sinhronizēt" data-i18n-title="syncBtn" style="display:none;"><span>🔄</span> <span data-i18n="syncBtn">Sinhronizēt</span></button>
     <button id="logoutBtn" class="btn-icon logout-btn btn-text-icon" title="Iziet" data-i18n-title="logout"><span>⎋</span> <span data-i18n="logout">Iziet</span></button>
    </header>

   <main class="main">

    <section class="client-info-card" id="clientInfoCard">
      <div class="client-info-header">
        <div class="client-info-name" id="clientName2">...</div>
        <button id="hospitalToggleBtn" class="btn-hospital-toggle" onclick="window.careForm?.toggleHospitalStatus()" title="Pārslēgt slimnīcas statusu">
          <span id="hospitalToggleIcon">🏥</span>
          <span id="hospitalToggleText">Slimnīcā</span>
        </button>
      </div>
      <div class="client-info-meta" id="clientDob"></div>
      <div class="client-info-tags">
        <span class="info-tag" id="clientDiet"></span>
        <span class="info-tag" id="clientSaskarsme"></span>
      </div>
    </section>

    <div id="adminModeBanner" class="admin-mode-banner" style="display:none;">
      ⚠️ <strong>Administratora režīms</strong> — Tev ir visu tiesības. Ierakstīsies kā: <span id="adminModeCaregiverName"></span>
    </div>

    <div id="hospitalBanner" class="hospital-banner" style="display:none;">
      <div class="hospital-banner-content">
        <span class="hospital-icon">🏥</span>
        <span class="hospital-text">Klients atrodas slimnīcā</span>
        <button id="hospitalReturnBtn" class="btn-hospital-return" onclick="window.careForm?.toggleHospitalStatus()">
          Atgriezies SAC
        </button>
      </div>
    </div>

    <div class="shift-tabs">
      <button class="shift-tab active" data-shift="R">
        <span class="shift-icon">☀️</span>
        <span data-i18n="morning">Rīts</span>
      </button>
      <button class="shift-tab" data-shift="V">
        <span class="shift-icon">🌙</span>
        <span data-i18n="evening">Vakars</span>
      </button>
    </div>

    <div class="team-summary" id="teamSummary">
      <em style="color:#999;" data-i18n="loading">Ielādēju...</em>
    </div>

    <section class="quick-totals" id="quickTotals">
      <div class="qt-card" data-counter="fluid">
        <div class="qt-emoji">💧</div>
        <div class="qt-info">
          <div class="qt-value" id="qtFluidValue">0 <span class="qt-unit">ml</span></div>
          <div class="qt-label" data-i18n="h2o">H2O</div>
          <div class="qt-meta" id="qtFluidMeta"></div>
        </div>
      </div>
      <div class="qt-card" data-counter="stool">
        <div class="qt-emoji">🚽</div>
        <div class="qt-info">
          <div class="qt-value" id="qtStoolValue">0 <span class="qt-unit">reizes</span></div>
          <div class="qt-label" data-i18n="bowelMovement">Vēdera izeja</div>
          <div class="qt-meta" id="qtStoolMeta"></div>
        </div>
      </div>
      <div class="qt-card" data-counter="diaper">
        <div class="qt-emoji">🧻</div>
        <div class="qt-info">
          <div class="qt-value" id="qtDiaperValue">0 <span class="qt-unit">maiņas</span></div>
          <div class="qt-label" data-i18n="diaperChange">Autiņbikšu maiņa</div>
          <div class="qt-meta" id="qtDiaperMeta"></div>
        </div>
      </div>
    </section>

    <div class="category-grid" id="categoryGrid">
      <button class="category-card cat-temp" data-cat="temp">
        <div class="cat-emoji">🌡️</div>
        <div class="cat-title" data-i18n="temperature">Temperatūra</div>
        <div class="cat-status" id="status-temp">—</div>
      </button>
      <button class="category-card cat-higiena" data-cat="higiena">
        <div class="cat-emoji">🧼</div>
        <div class="cat-title" data-i18n="hygiene">Higiēna</div>
        <div class="cat-status" id="status-higiena">—</div>
      </button>
      <button class="category-card cat-aktivitate" data-cat="aktivitate">
        <div class="cat-emoji">🚶</div>
        <div class="cat-title" data-i18n="activity">Aktivitāte</div>
        <div class="cat-status" id="status-aktivitate">—</div>
      </button>
      <button class="category-card cat-edinasana" data-cat="edinasana">
        <div class="cat-emoji">🍽️</div>
        <div class="cat-title" data-i18n="meals">Ēdīšana</div>
        <div class="cat-status" id="status-edinasana">—</div>
      </button>
      <button class="category-card cat-h2o" data-cat="h2o">
        <div class="cat-emoji">💧</div>
        <div class="cat-title" data-i18n="h2o">H2O</div>
        <div class="cat-status" id="status-h2o">—</div>
      </button>
      <button class="category-card cat-urina" data-cat="urina">
        <div class="cat-emoji">💧</div>
        <div class="cat-title" data-i18n="urineOutput">Urīna daudzums</div>
        <div class="cat-status" id="status-urina">—</div>
      </button>
      <button class="category-card cat-fiziologija" data-cat="fiziologija">
        <div class="cat-emoji">🚽</div>
        <div class="cat-title" data-i18n="bowelMovement">Vēdera izeja</div>
        <div class="cat-status" id="status-fiziologija">—</div>
      </button>
      <button class="category-card cat-ada" data-cat="ada">
        <div class="cat-emoji">🧴</div>
        <div class="cat-title" data-i18n="skinCare">Ādas kopšana</div>
        <div class="cat-status" id="status-ada">—</div>
      </button>
      <button class="category-card cat-pastaiga" data-cat="pastaiga">
        <div class="cat-emoji">🌳</div>
        <div class="cat-title" data-i18n="walk">Pastaiga</div>
        <div class="cat-status" id="status-pastaiga">—</div>
      </button>
      <button class="category-card cat-ciemini" data-cat="ciemini">
        <div class="cat-emoji">👥</div>
        <div class="cat-title" data-i18n="visitors">Ciemiņi</div>
        <div class="cat-status" id="status-ciemini">—</div>
      </button>
      <button class="category-card cat-diapers" data-cat="diapers">
        <div class="cat-emoji">🧻</div>
        <div class="cat-title" data-i18n="diaperChange">Autiņbikšu maiņa</div>
        <div class="cat-status" id="status-diapers">—</div>
      </button>
    </div>

    <div class="signature-card">
      <div class="signature-card-left">
        <div class="signature-card-title" data-i18n="signature">Aprūpētāja paraksts</div>
        <div class="signature-card-info" id="signedBy" style="display:none;"></div>
      </div>
      <button id="signBtn" class="sign-btn" data-i18n="signature">Parakstīties</button>
    </div>

    <div class="history-card">
      <div class="history-card-header">
        <h3 data-i18n="history">📜 Šodienas vēsture</h3>
      </div>
      <div id="historyContainer" class="history-container">
        <div class="loading" data-i18n="noRecords">Nav ierakstu</div>
      </div>
    </div>
  </main>

  <div id="categoryModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <button id="modalClose" class="btn-icon" data-i18n="backBtn">←</button>
        <h2 id="modalTitle">...</h2>
        <div style="width: 38px;"></div>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <div id="loadingOverlay" class="loading-overlay" style="display:none;">
    <div class="loading-modal">
      <img src="logo/logoDS.png" alt="Aprūpes sistēma" class="loading-logo">
      <div class="loading-spinner"></div>
      <div id="loadingText" class="loading-text" data-i18n="loading">Ielādēju datus...</div>
      <button id="retryLoadBtn" class="retry-btn" style="display:none;" data-i18n="retryLoad">Mēģināt vēlreiz</button>
    </div>
  </div>

<script src="js/config.js?v=20260923-0840"></script>
  <script src="js/i18n.js?v=20260923-0840"></script>
  <script src="js/timezone.js?v=20260923-0840"></script>
  <script src="js/db.js?v=20260923-0840"></script>
  <script src="js/sync.js?v=20260923-0840"></script>
  <script src="js/logout.js?v=20260923-0840"></script>
  <script src="js/tasks.js?v=20260923-0840"></script>
  <script src="js/care_form.js?v=20260923-0840"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=20260923-0840', { updateViaCache: 'none' })
        .catch(err => console.warn('[SW] Registration failed:', err));
      
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'UPDATE_AVAILABLE') {
          showUpdateNotification();
        }
      });
    }
    
    function showUpdateNotification() {
      if (document.getElementById('updateNotification')) return;
      const notification = document.createElement('div');
      notification.id = 'updateNotification';
      notification.style.cssText = `
        position: fixed; top: 20px; right: 20px; z-index: 10000;
        background: #2196F3; color: white; padding: 16px 24px;
        border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        font-family: system-ui, sans-serif; font-size: 14px; max-width: 320px;
        animation: slideIn 0.3s ease-out;
      `;
      notification.innerHTML = `
        <div style="font-weight: 600; margin-bottom: 8px;">🔄 Jauna versija pieejama</div>
        <div style="margin-bottom: 12px; opacity: 0.9;">Lietotnē ir atjauninājumi. Nospied "Atjaunot", lai to lietotu.</div>
        <button id="updateNowBtn" style="
          background: white; color: #2196F3; border: none; padding: 10px 20px;
          border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 14px;
        ">Atjaunot tagad</button>
        <style>
          @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        </style>
      `;
      document.body.appendChild(notification);
      document.getElementById('updateNowBtn').addEventListener('click', () => {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.ready.then(reg => {
            reg.waiting?.postMessage({ type: 'SKIP_WAITING' });
            window.location.reload();
          });
        } else {
          window.location.reload();
        }
      });
    }
  </script>
</body>
</html>
