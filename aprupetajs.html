<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c3e50">
  <title data-i18n="loginTitle">Aprūpes forma</title>
  <link rel="stylesheet" href="css/aprupetajs.css?v=20250912-1915">
  <link rel="icon" href="logo/logo_admin.png" type="image/png">
</head>
<body>
   <header class="header">
    <button id="backBtn" class="btn-icon btn-text-icon" title="Atpakaļ"><span>←</span> <span data-i18n="backBtn">Atpakaļ</span></button>
    <div class="lang-switcher">
      <button data-lang="lv" class="lang-btn active">LV</button>
      <button data-lang="ru" class="lang-btn">RU</button>
      <button data-lang="en" class="lang-btn">EN</button>
    </div>
    <h1 id="clientName">...</h1>
    <span id="syncStatus" class="sync-badge" data-i18n="syncBtn">Saglabāts</span>
    <button id="logoutBtn" class="btn-icon logout-btn btn-text-icon" title="Iziet"><span>⎋</span> <span data-i18n="logout">Iziet</span></button>
   </header>

  <main class="main">
    <div id="taskBannerContainer"></div>

    <section class="client-info-card" id="clientInfoCard">
      <div class="client-info-name" id="clientName2">...</div>
      <div class="client-info-meta" id="clientDob"></div>
      <div class="client-info-tags">
        <span class="info-tag" id="clientDiet"></span>
        <span class="info-tag" id="clientSaskarsme"></span>
      </div>
    </section>

    <div id="adminModeBanner" class="admin-mode-banner" style="display:none;">
      ⚠️ <strong>Administratora režīms</strong> — Tev ir visu tiesības. Ierakstīsies kā: <span id="adminModeCaregiverName"></span>
    </div>

    <div class="shift-tabs">
      <button class="shift-tab active" data-shift="R">
        <span class="shift-icon">☀️</span>
        <span data-i18n="morning">Rīts</span>
      </button>
      <button class="shift-tab" data-shift="V">
        <span class="shift-icon">🌙</span>
        <span data-i18n="evening">Vakars</span>
      </button>
    </div>

    <div class="team-summary" id="teamSummary">
      <em style="color:#999;" data-i18n="loading">Ielādēju...</em>
    </div>

    <section class="quick-totals" id="quickTotals">
      <div class="qt-card" data-counter="fluid">
        <div class="qt-emoji">💧</div>
        <div class="qt-info">
          <div class="qt-value" id="qtFluidValue">0 <span class="qt-unit">ml</span></div>
          <div class="qt-label" data-i18n="fluids">Šķidrumi</div>
          <div class="qt-meta" id="qtFluidMeta"></div>
        </div>
      </div>
      <div class="qt-card" data-counter="stool">
        <div class="qt-emoji">🚽</div>
        <div class="qt-info">
          <div class="qt-value" id="qtStoolValue">0 <span class="qt-unit">reizes</span></div>
          <div class="qt-label" data-i18n="physiology">Fiziologija</div>
          <div class="qt-meta" id="qtStoolMeta"></div>
        </div>
      </div>
      <div class="qt-card" data-counter="diaper">
        <div class="qt-emoji">🧻</div>
        <div class="qt-info">
          <div class="qt-value" id="qtDiaperValue">0 <span class="qt-unit">maiņas</span></div>
          <div class="qt-label" data-i18n="hygiene">Higiēna</div>
          <div class="qt-meta" id="qtDiaperMeta"></div>
        </div>
      </div>
    </section>

    <div class="category-grid" id="categoryGrid">
      <button class="category-card cat-temp" data-cat="temp">
        <div class="cat-emoji">🌡️</div>
        <div class="cat-title" data-i18n="temperature">Temperatūra</div>
        <div class="cat-status" id="status-temp">—</div>
      </button>
      <button class="category-card cat-higiena" data-cat="higiena">
        <div class="cat-emoji">🧼</div>
        <div class="cat-title" data-i18n="hygiene">Higiēna</div>
        <div class="cat-status" id="status-higiena">—</div>
      </button>
      <button class="category-card cat-aktivitate" data-cat="aktivitate">
        <div class="cat-emoji">🚶</div>
        <div class="cat-title" data-i18n="activity">Aktivitāte</div>
        <div class="cat-status" id="status-aktivitate">—</div>
      </button>
      <button class="category-card cat-edinasana" data-cat="edinasana">
        <div class="cat-emoji">🍽️</div>
        <div class="cat-title" data-i18n="meals">Ēdīšana</div>
        <div class="cat-status" id="status-edinasana">—</div>
      </button>
      <button class="category-card cat-sikdrumi" data-cat="sikdrumi">
        <div class="cat-emoji">💧</div>
        <div class="cat-title" data-i18n="fluids">Šķidrumi</div>
        <div class="cat-status" id="status-sikdrumi">—</div>
      </button>
      <button class="category-card cat-fiziologija" data-cat="fiziologija">
        <div class="cat-emoji">🚽</div>
        <div class="cat-title" data-i18n="physiology">Fiziologija</div>
        <div class="cat-status" id="status-fiziologija">—</div>
      </button>
      <button class="category-card cat-ada" data-cat="ada">
        <div class="cat-emoji">🧴</div>
        <div class="cat-title" data-i18n="other">Citi pasākumi</div>
        <div class="cat-status" id="status-ada">—</div>
      </button>
      <button class="category-card cat-pastaiga" data-cat="pastaiga">
        <div class="cat-emoji">🌳</div>
        <div class="cat-title" data-i18n="other">Citi pasākumi</div>
        <div class="cat-status" id="status-pastaiga">—</div>
      </button>
      <button class="category-card cat-ciemini" data-cat="ciemini">
        <div class="cat-emoji">👥</div>
        <div class="cat-title" data-i18n="other">Citi pasākumi</div>
        <div class="cat-status" id="status-ciemini">—</div>
      </button>
      <button class="category-card cat-diapers" data-cat="diapers">
        <div class="cat-emoji">🧻</div>
        <div class="cat-title" data-i18n="hygiene">Higiēna</div>
        <div class="cat-status" id="status-diapers">—</div>
      </button>
    </div>

    <div class="signature-card">
      <div class="signature-card-left">
        <div class="signature-card-title" data-i18n="signature">Aprūpētāja paraksts</div>
        <div class="signature-card-info" id="signedBy" style="display:none;"></div>
      </div>
      <button id="signBtn" class="sign-btn" data-i18n="signature">Parakstīties</button>
    </div>

    <div class="history-card">
      <div class="history-card-header">
        <h3 data-i18n="history">📜 Šodienas vēsture</h3>
      </div>
      <div id="historyContainer" class="history-container">
        <div class="loading" data-i18n="noRecords">Nav ierakstu</div>
      </div>
    </div>
  </main>

  <div id="categoryModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <button id="modalClose" class="btn-icon" data-i18n="backBtn">←</button>
        <h2 id="modalTitle">...</h2>
        <div style="width: 38px;"></div>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <div id="loadingOverlay" class="loading-overlay" style="display:none;">
    <div class="loading-modal">
      <img src="logo/logoDS.png" alt="Aprūpes sistēma" class="loading-logo">
      <div class="loading-spinner"></div>
      <div id="loadingText" class="loading-text" data-i18n="loading">Ielādēju datus...</div>
    </div>
  </div>

  <script src="js/config.js?v=20250912-1915"></script>
  <script src="js/i18n.js?v=20250912-1915"></script>
  <script src="js/db.js?v=20250912-1915"></script>
  <script src="js/sync.js?v=20250912-1915"></script>
  <script src="js/logout.js?v=20250912-1915"></script>
  <script src="js/tasks.js?v=20250912-1915"></script>
  <script src="js/care_form.js?v=20250912-1915"></script>
</body>
</html>
