<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c3e50">
  <title data-i18n="loginTitle">Aprūpes sistēma – Klienti</title>
  <link rel="stylesheet" href="css/aprupe.css?v=20250912-1850">
  <link rel="icon" href="logo/logo_admin.png" type="image/png">
</head>
<body>
   <header class="header">
    <div class="header-left">
      <button id="backBtn" class="btn-icon btn-text-icon" title="Atpakaļ"><span>←</span> <span data-i18n="backBtn">Atpakaļ</span></button>
    </div>
    <div class="header-center">
      <img src="logo/logo_admin.png" alt="Logo" class="header-logo">
      <h1 data-i18n="loginTitle">Aprūpes sistēma</h1>
    </div>
    <div class="header-right">
      <span id="syncStatus" class="sync-badge" data-i18n="syncBtn">Saglabāts</span>
      <div class="lang-switcher">
        <button data-lang="lv" class="lang-btn active">LV</button>
        <button data-lang="ru" class="lang-btn">RU</button>
        <button data-lang="en" class="lang-btn">EN</button>
      </div>
      <button id="logoutBtn" class="btn-icon logout-btn btn-text-icon" title="Iziet"><span>⎋</span> <span data-i18n="logout">Iziet</span></button>
    </div>
   </header>

  <main class="main">
    <div id="taskBannerContainer"></div>

    <div class="search-container">
      <input type="text" id="searchBox" data-i18n="searchPlaceholder" placeholder="Meklēt klientu pēc vārda vai uzvārda..." autocomplete="off" maxlength="100">
      <span id="searchCount" class="search-count"></span>
    </div>

    <div id="clientGrid" class="client-grid">
      <div class="loading" data-i18n="loading">Ielādēju...</div>
    </div>
  </main>

  <div id="loadingOverlay" class="loading-overlay" style="display:none;">
    <div class="loading-modal">
      <img src="logo/logoDS.png" alt="Aprūpes sistēma" class="loading-logo">
      <div class="loading-spinner"></div>
      <div id="loadingText" class="loading-text" data-i18n="loading">Ielādēju datus...</div>
    </div>
  </div>

  <script src="js/config.js?v=20250912-1850"></script>
  <script src="js/i18n.js?v=20250912-1850"></script>
  <script src="js/db.js?v=20250912-1850"></script>
  <script src="js/sync.js?v=20250912-1850"></script>
  <script src="js/logout.js?v=20250912-1850"></script>
  <script src="js/tasks.js?v=20250912-1850"></script>
  <script src="js/aprupe.js?v=20250912-1850"></script>
</body>
</html>
