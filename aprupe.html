<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c3e50">
  <title data-i18n="loginTitle">Aprūpes sistēma – Klienti</title>
  <link rel="stylesheet" href="css/aprupe.css">
  <link rel="icon" href="logo/logo_admin.png" type="image/png">
</head>
<body>
  <div class="lang-switcher">
    <button data-lang="lv" class="lang-btn active">LV</button>
    <button data-lang="ru" class="lang-btn">RU</button>
    <button data-lang="en" class="lang-btn">EN</button>
  </div>
  <header class="header">
    <div class="header-left">
      <button id="logoutBtn" class="btn-icon logout-btn" title="Izlogoties">
        <span data-i18n="logoutBtn">⎋</span>
      </button>
    </div>
    <div class="header-center">
      <img src="logo/logo_admin.png" alt="Logo" class="header-logo">
      <h1 data-i18n="loginTitle">Aprūpes sistēma</h1>
    </div>
    <div class="header-right">
      <span id="syncStatus" class="sync-badge" data-i18n="syncBtn">Saglabāts</span>
    </div>
  </header>

  <main class="main">
    <div id="taskBannerContainer"></div>

    <div class="search-container">
      <input type="text" id="searchBox" data-i18n="searchPlaceholder" placeholder="Meklēt klientu pēc vārda vai uzvārda..." autocomplete="off" maxlength="100">
      <span id="searchCount" class="search-count"></span>
    </div>

    <div id="clientGrid" class="client-grid">
      <div class="loading" data-i18n="loading">Ielādēju...</div>
    </div>
  </main>

  <script src="js/config.js?v=20250907"></script>
  <script src="js/i18n.js?v=20250907"></script>
  <script src="js/db.js?v=20250907"></script>
  <script src="js/sync.js?v=20250907"></script>
  <script src="js/logout.js?v=20250907"></script>
  <script src="js/tasks.js?v=20250907"></script>
  <script src="js/aprupe.js?v=20250907"></script>
</body>
</html>
