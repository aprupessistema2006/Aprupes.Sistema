<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#2c3e50">
  <title data-i18n="loginTitle">Aprūpes sistēma – Klienti</title>
  <link rel="stylesheet" href="css/aprupe.css?v=20260925-1664">
  <link rel="icon" href="logo/logo_admin.png" type="image/png">
</head>
<body>
    <header class="header">
     <div class="header-left">
       <button id="backBtn" class="btn-icon btn-text-icon" title="Atpakaļ" data-i18n-title="backBtn"><span>←</span> <span data-i18n="backBtn">Atpakaļ</span></button>
     </div>
     <div class="header-center">
       <img src="logo/logo_admin.png" alt="Logo" class="header-logo">
       <div class="header-title">
         <h1 data-i18n="appName">Aprūpes sistēma</h1>
         <span id="currentUserLabel" class="current-user-label"></span>
       </div>
     </div>
     <div class="header-right">
       <span id="syncStatus" class="sync-badge" data-i18n="syncBtn">Saglabāts</span>
       <button id="manualSyncBtn" class="btn-icon btn-text-icon sync-btn" title="Sinhronizēt" data-i18n-title="syncBtn" style="display:inline-flex;"><span>🔄</span> <span data-i18n="syncBtn">Sinhronizēt</span></button>
       <div class="lang-switcher">
         <button data-lang="lv" class="lang-btn active">LV</button>
         <button data-lang="ru" class="lang-btn">RU</button>
         <button data-lang="en" class="lang-btn">EN</button>
       </div>
       <button id="logoutBtn" class="btn-icon logout-btn btn-text-icon" title="Iziet" data-i18n-title="logout"><span>⎋</span> <span data-i18n="logout">Iziet</span></button>
     </div>
    </header>

    <div id="newTaskAlert" class="new-task-alert" role="alert" aria-live="polite" hidden>
      <button id="newTaskAlertBtn" type="button" class="new-task-alert-main">
        <span class="new-task-alert-icon" aria-hidden="true">!</span>
        <span id="newTaskAlertText"></span>
        <span class="new-task-alert-arrow" aria-hidden="true">↓</span>
      </button>
      <button id="newTaskAlertClose" type="button" class="new-task-alert-close" title="Aizvērt" aria-label="Aizvērt">×</button>
    </div>

    <main class="main">
      <div class="search-container">
         <input type="text" id="searchBox" data-i18n="clientSearchPlaceholder" placeholder="Meklēt klientu pēc vārda vai uzvārda..." autocomplete="off" maxlength="100">
        <span id="searchCount" class="search-count"></span>
      </div>

      <div class="client-container">
        <div id="clientGrid" class="client-grid">
          <div class="loading" data-i18n="loading">Ielādēju...</div>
        </div>
      </div>

      <section class="tasks-section" id="tasksSection">
        <div class="tasks-section-header">
          <h3 class="tasks-section-title" data-i18n="myTasksTitle">📋 Mani uzdevomi</h3>
          <div id="clientFilterBadge" class="client-filter-badge" style="display:none;">
            <span id="filterClientName"></span>
            <button id="clearFilterBtn" class="clear-filter-btn" title="Notīrīt filtru">×</button>
          </div>
        </div>
        <div class="tasks-table-wrapper">
          <table class="tasks-table" id="tasksTable">
            <thead>
<tr>
                 <th data-i18n="taskColTaskText">Uzdevums</th>
                 <th data-i18n="taskColClient">Klients</th>
                 <th data-i18n="taskColDeadline">Termiņš</th>
                 <th data-i18n="taskColPriority">Prioritāte</th>
                 <th data-i18n="taskColStatus">Statuss</th>
                 <th data-i18n="taskColCreated">Izveidots</th>
                 <th data-i18n="taskCompletedLabel">Pabeigts</th>
                 <th data-i18n="taskColAction">Darbība</th>
               </tr>
            </thead>
            <tbody id="tasksTableBody">
              <tr class="tasks-empty-row">
                <td colspan="7" class="loading" data-i18n="noClientSelected">Ielādēju...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

  <div id="loadingOverlay" class="loading-overlay" style="display:none;">
    <div class="loading-modal">
      <img src="logo/logoDS.png" alt="Aprūpes sistēma" class="loading-logo">
      <div class="loading-spinner"></div>
      <div id="loadingText" class="loading-text" data-i18n="loading">Ielādēju datus...</div>
      <button id="retryLoadBtn" class="retry-btn" style="display:none;" data-i18n="retryLoad">Mēģināt vēlreiz</button>
    </div>
  </div>

  <!-- Uzdevuma detaļu logs (atsevišķā logā pilna ainavu redzēšanai) -->
  <div id="taskDetailOverlay" class="task-detail-overlay" style="display:none;">
    <div class="task-detail-card">
      <div class="task-detail-header">
        <div class="task-detail-title">
          <span class="task-detail-emoji">📋</span>
          <h3 id="taskDetailTitle" data-i18n="taskDetailTitle">Uzdevuma detaļas</h3>
        </div>
        <button id="taskDetailClose" class="task-detail-close" title="Aizvērt" data-i18n-title="closeBtn">✕</button>
      </div>
      <div class="task-detail-body">
        <div class="task-detail-section">
          <div class="task-detail-label" data-i18n="taskColTaskText">Uzdevums</div>
          <div id="taskDetailText" class="task-detail-value task-detail-text"></div>
        </div>
        <div class="task-detail-section">
          <div class="task-detail-label" data-i18n="taskColClient">Klients</div>
          <div id="taskDetailClient" class="task-detail-value"></div>
        </div>
        <div class="task-detail-section">
          <div class="task-detail-label" data-i18n="taskColDeadline">Termiņš</div>
          <div id="taskDetailDeadline" class="task-detail-value"></div>
        </div>
        <div class="task-detail-section">
          <div class="task-detail-label" data-i18n="taskColPriority">Prioritāte</div>
          <div id="taskDetailPriority" class="task-detail-value"></div>
        </div>
        <div class="task-detail-section">
          <div class="task-detail-label" data-i18n="taskColStatus">Statuss</div>
          <div id="taskDetailStatus" class="task-detail-value"></div>
        </div>
        <div class="task-detail-section">
          <div class="task-detail-label" data-i18n="taskColCreated">Izveidots</div>
          <div id="taskDetailCreated" class="task-detail-value"></div>
        </div>
        <div class="task-detail-section">
          <div class="task-detail-label" data-i18n="taskColAction">Darbība</div>
          <div id="taskDetailAction" class="task-detail-value"></div>
        </div>
        <div class="task-detail-section" id="taskDetailCompletedSection" style="display:none;">
          <div class="task-detail-label" data-i18n="taskCompletedLabel">Pabeigts</div>
          <div id="taskDetailCompleted" class="task-detail-value"></div>
        </div>
        <div class="task-detail-section" id="taskDetailAssigneeSection" style="display:none;">
          <div class="task-detail-label" data-i18n="taskAssignee">Izpildītājs</div>
          <div id="taskDetailAssignee" class="task-detail-value"></div>
        </div>
      </div>
      <div class="task-detail-footer">
        <button id="taskDetailCloseBtn" class="task-detail-close-btn" data-i18n="closeBtn">Aizvērt</button>
        <button id="taskDetailCompleteBtn" class="task-detail-complete-btn" data-i18n="taskMarkDone">✓ Izpildīts</button>
      </div>
    </div>
  </div>

<script src="js/config.js?v=20260925-1664"></script>
  <script src="js/i18n.js?v=20260925-1664"></script>
  <script src="js/timezone.js?v=20260925-1664"></script>
  <script src="js/db.js?v=20260925-1664"></script>
  <script src="js/sync.js?v=20260925-1664"></script>
  <script src="js/logout.js?v=20260925-1664"></script>
  <script src="js/tasks.js?v=20260925-1664"></script>
  <script src="js/aprupe.js?v=20260925-1664"></script>
  <script src="js/update_notifier.js?v=20260925-1664"></script>
</body>
</html>
